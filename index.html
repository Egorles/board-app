<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Board</title>
<style>
:root{
  --bg:#f2f3f5;--surface:#ffffff;--surface2:#f6f8fa;--border:#d8dee4;--text:#1f2328;--muted:#656d76;
  --accent:#0969da;--danger:#cf222e;--green:#1f883d;--backdrop:rgba(0,0,0,.35);--blur:rgba(242,243,245,.85);
  --hdr:96px;--kb:0px;--vvh:100dvh;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#8d96a0;
  --accent:#4493f8;--danger:#f85149;--green:#2ea043;--backdrop:rgba(0,0,0,.6);--blur:rgba(13,17,23,.85);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:manipulation}
html.locked,html.locked body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;min-height:100dvh;padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button,.tab,.chip,.row,.group-head,.btn{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.top{position:sticky;top:0;z-index:10;background:var(--blur);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--border);padding-top:env(safe-area-inset-top)}
.title-row{display:flex;align-items:center;gap:2px;padding:6px max(8px,env(safe-area-inset-right)) 2px max(16px,env(safe-area-inset-left))}
.title-row h1{flex:1;margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:22px;font-size:21px;color:var(--accent);display:grid;place-items:center}
.icon-btn:active{background:var(--surface2)}
.icon-btn[hidden]{display:none}
.icon-btn.busy{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-left)) 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:0 13px;height:36px;font-size:15px;font-weight:500;white-space:nowrap}
.tab.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.active .n{color:inherit;opacity:.7}
.tab.no-status .dot{border:1.5px dashed var(--muted);background:transparent;width:9px;height:9px}
.ptr{position:fixed;left:50%;top:calc(var(--hdr) + 8px);width:34px;height:34px;margin-left:-17px;border-radius:17px;background:var(--surface);border:.5px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;color:var(--accent);font-size:18px;z-index:9;opacity:0;transform:translateY(-40px);pointer-events:none}
.ptr.ready{color:var(--green)}
.ptr.spin span{display:inline-block;animation:spin .8s linear infinite}
main{padding:4px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));max-width:720px;margin:0 auto}
.group{margin:6px 0 14px}
.group-head{position:sticky;top:var(--hdr);z-index:2;display:flex;align-items:center;background:var(--bg)}
.gh-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:10px 4px 6px;text-align:left}
.gh-more{border:0;background:transparent;color:var(--muted);font-size:20px;width:40px;height:36px;border-radius:18px;margin-top:4px}
.gh-more:active{background:var(--surface2)}
.chev{display:inline-block;color:var(--muted);transition:transform .15s;transform:rotate(90deg);width:14px;text-align:center;font-size:17px}
.group.collapsed .chev{transform:none}
.gt{flex:1;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.rows{background:var(--surface);border-radius:12px;overflow:hidden;border:.5px solid var(--border)}
.swipe{position:relative;overflow:hidden;border-bottom:.5px solid var(--border)}
.swipe:last-child{border-bottom:0}
.swipe-act{visibility:hidden;position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 20px;color:#fff;font-weight:600;font-size:15px}
.swipe-act.left{left:0;right:50%;background:var(--accent);justify-content:flex-start}
.swipe-act.right{right:0;left:50%;background:var(--green);justify-content:flex-end}
.swipe-act.armed{filter:brightness(1.15)}
.row{position:relative;display:flex;align-items:center;gap:8px;width:100%;min-height:50px;border:0;background:var(--surface);text-align:left;padding:12px 10px 12px 14px;will-change:transform}
.row.snap{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.row:active{background:var(--surface2)}
.row.pending .rt{opacity:.55}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;flex:none}
.rt{flex:1;min-width:0;word-break:break-word}
.re{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#groupBtn{font-size:19px}
#groupBtn.off{color:var(--muted)}
.rows.sorting{overflow:visible}
.rows.sorting .swipe{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.rows.sorting .swipe.lifted{transition:none;z-index:6;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.28);border-bottom-color:transparent}
.swipe.lifted .row{background:var(--surface2);border-radius:12px}
html.sorting,html.sorting body{-webkit-user-select:none;user-select:none}
.has{color:var(--muted);font-size:14px}
.rchev{color:var(--border);font-size:20px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:56px 16px}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;border:0;background:var(--green);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;transition:transform .1s}
.fab:active{transform:scale(.93)}
.fab[hidden]{display:none}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--backdrop);opacity:0;pointer-events:none;transition:opacity .25s;touch-action:none}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb);max-height:calc(var(--vvh) - env(safe-area-inset-top) - 10px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;background:var(--surface);border-radius:16px 16px 0 0;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(16px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;box-shadow:0 -4px 24px rgba(0,0,0,.18)}
.sheet-wrap.open .sheet{transform:none}
.sheet.dragging{transition:none}
html.kb .sheet{padding-bottom:12px}
.grab{position:sticky;top:0;z-index:1;background:var(--surface);padding:8px 0 10px;margin:0 -16px;touch-action:none}
.grab::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--border);margin:0 auto}
.sheet h3{margin:0 0 8px;font-size:20px}
.field-label{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:500}
textarea,input[type=password],input[type=text],select{width:100%;border:1px solid var(--border);background:var(--surface2);border-radius:10px;padding:11px 12px;font-size:16px;outline:none;resize:none;-webkit-appearance:none;appearance:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.t-title{font-size:19px;font-weight:600;background:transparent;border-color:transparent;padding:6px 4px;line-height:1.3}
.t-title:focus{background:var(--surface2)}
.new-title{font-weight:500;background:var(--surface2);border-color:var(--border);padding:11px 12px}
.new-body{margin-top:8px;font-size:16px}
.list{background:var(--surface2);border:.5px solid var(--border);border-radius:12px;overflow:hidden}
.list-row,.pick-row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 12px;border:0;border-bottom:.5px solid var(--border);background:transparent;text-align:left;font-size:16px}
.list-row:last-child,.pick-row:last-child{border-bottom:0}
.list-row:active{background:var(--surface)}
.pick-row input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.pick-row.all{background:transparent;border:0;padding:4px 12px 8px;min-height:40px}
.lr-title{flex:1;min-width:0;word-break:break-word}
.inline-add{display:flex;gap:8px}
.inline-add input{flex:1}
.st-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:.5px solid var(--border)}
.st-row:last-child{border-bottom:0}
.st-dot{width:30px;height:30px;border-radius:15px;border:0;background:transparent;display:grid;place-items:center;flex:none}
.st-dot::after{content:"";width:16px;height:16px;border-radius:50%;background:var(--c)}
.st-name{flex:1;min-width:0;padding:8px 10px!important}
.st-btn{width:34px;height:36px;border:0;background:transparent;color:var(--accent);font-size:17px;border-radius:8px;flex:none}
.st-btn:disabled{color:var(--border)}
.st-btn.danger{color:var(--danger);font-size:22px}
.actions.two{grid-template-columns:1fr 1fr}
.small{font-size:13px;margin:4px 4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:18px;padding:0 14px;height:36px;font-size:15px;display:flex;align-items:center;gap:6px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.active .dot{background:#fff}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr 2fr;gap:8px;margin-top:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:0 14px;font-size:16px;font-weight:500;text-decoration:none;color:var(--text);min-height:46px}
.btn:active{opacity:.6}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.danger{color:var(--danger);background:transparent;border-color:transparent}
.btn.wide{width:100%;margin-top:10px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:15px;min-height:44px}
.toggle input{width:24px;height:24px;accent-color:var(--accent);margin:0}
.setup{background:var(--surface);border-radius:14px;padding:20px;margin-top:16px;border:.5px solid var(--border)}
.setup h2{margin:0 0 8px;font-size:20px}
.setup p{color:var(--muted);margin:0 0 14px}
.setup input{margin-top:12px}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:5px}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-16px);display:flex;align-items:center;gap:14px;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.show.has-action{pointer-events:auto}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;font-size:15px}
@media (prefers-color-scheme:dark){.toast button{color:#0969da}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="title-row">
    <h1 id="title">Board</h1>
    <button class="icon-btn" id="groupBtn" aria-label="Группировка по эпикам"></button>
    <button class="icon-btn" id="refreshBtn" aria-label="Обновить">↻</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Настройки">⚙︎</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="ptr" id="ptr"><span>↓</span></div>
<main id="list"></main>
<button class="fab" id="fab" aria-label="Новая задача" hidden>+</button>
<div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
